<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cyber-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glowing ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#cyber-gradient)" stroke-width="2" filter="url(#glow)" opacity="0.3" />
  
  <!-- Inner Book / Shield representation -->
  <path d="M50,15 L75,25 L75,55 C75,70 65,82 50,88 C35,82 25,70 25,55 L25,25 Z" fill="#060814" stroke="url(#cyber-gradient)" stroke-width="3" filter="url(#glow)" />
  
  <!-- Stylized L letter in center -->
  <path d="M42,32 L42,62 L58,62" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M42,32 L42,62 L58,62" fill="none" stroke="url(#cyber-gradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>